[project]
name = "reflex-a2a"
version = "0.1.0"
description = "A2A Demo UI with integrated Host Agent built with Reflex"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "reflex>=0.7.0",
    "httpx>=0.27.0",
    "google-adk[a2a]>=0.5.0",
    "a2a>=0.2.0",
    "litellm>=1.60.0",
    "google-genai>=1.10.0",
]

[project.scripts]
reflex_a2a = "reflex_a2a.reflex_a2a:app"
